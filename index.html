<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CevapBende - MEB Uyumlu Akıllı Soru Çözücü</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .canvas-container {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        CevapBende <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">MEB Uyumlu</span>
                    </h1>
                    <p class="text-xs text-slate-400">Ortaokul & Lise Akıllı Soru Çözücü</p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Sıfırla
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 pb-12">

        <!-- API Key & Sınıf/Ders Seçim Paneli -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            <!-- API Key -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-key text-blue-400"></i> Gemini API Anahtarı
                </label>
                <div class="flex gap-2">
                    <input type="password" id="apiKey" placeholder="AIzaSy..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-blue-600/20">Kaydet</button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-800">
                <!-- Sınıf Seviyesi -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Okul / Sınav Seviyesi</label>
                    <select id="gradeLevel" onchange="updateLessons()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="5. Sınıf">5. Sınıf</option>
                        <option value="6. Sınıf">6. Sınıf</option>
                        <option value="7. Sınıf">7. Sınıf</option>
                        <option value="8. Sınıf (LGS)">8. Sınıf (LGS)</option>
                        <option value="9. Sınıf">9. Sınıf</option>
                        <option value="10. Sınıf">10. Sınıf</option>
                        <option value="11. Sınıf">11. Sınıf</option>
                        <option value="12. Sınıf (TYT/AYT)">12. Sınıf / Mezun (TYT-AYT)</option>
                    </select>
                </div>
                <!-- Ders Seçimi -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Ders</label>
                    <select id="lessonSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <!-- Dinamik doldurulacak -->
                    </select>
                </div>
            </div>
        </section>

        <!-- Soru Giriş Yöntemleri (Tab) -->
        <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1 shadow-md">
            <button onclick="switchTab('draw')" id="tabDraw" class="flex-1 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-pen-nib"></i> El Yazısı / Çizim
            </button>
            <button onclick="switchTab('photo')" id="tabPhoto" class="flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-camera"></i> Fotoğraf Yükle / Çek
            </button>
        </div>

        <!-- Çizim Sekmesi -->
        <div id="sectionDraw" class="space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl canvas-container">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-slate-400 font-medium">Soruyu parmağınla veya kalemle tahtaya yaz/çiz:</span>
                    <div class="flex gap-2">
                        <button onclick="setTool('pen')" id="btnPen" class="px-3 py-1 bg-blue-600 text-white text-xs rounded-lg font-medium transition">Kalem</button>
                        <button onclick="setTool('eraser')" id="btnEraser" class="px-3 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg font-medium transition">Silgi</button>
                        <button onclick="clearCanvas()" class="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 text-xs rounded-lg font-medium hover:bg-red-500/30 transition">Temizle</button>
                    </div>
                </div>
                <div class="border border-slate-700 rounded-xl overflow-hidden bg-white cursor-crosshair">
                    <canvas id="drawingCanvas" width="600" height="300" class="w-full h-64 touch-none"></canvas>
                </div>
            </div>
        </div>

        <!-- Fotoğraf Sekmesi (Gizli Başlangıçta) -->
        <div id="sectionPhoto" class="hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-4">
                <div class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-6 transition cursor-pointer relative" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-500 mb-2"></i>
                    <p class="text-sm font-medium text-slate-300">Sorunun fotoğrafını yükle veya çek</p>
                    <p class="text-xs text-slate-500 mt-1">PNG, JPG formatları desteklenir</p>
                    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </div>
                <div id="previewContainer" class="hidden relative inline-block">
                    <img id="imagePreview" class="max-h-48 rounded-xl border border-slate-700 mx-auto">
                    <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full p-1 text-xs shadow-md"><i class="fa-solid fa-xmark w-4 h-4 flex items-center justify-center"></i></button>
                </div>
            </div>
        </div>

        <!-- Öğrenci Notu & Çözüm Butonu -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Ek Not / Takıldığın Yer (İsteğe Bağlı)</label>
                <input type="text" id="studentNote" placeholder="Örn: Bu sorunun ikinci adımında takıldım, burayı anlamadım..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            </div>

            <button onclick="solveQuestion()" id="solveBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-xl shadow-blue-600/30 transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i> MEB Kazanımına Göre Çöz ve Açıkla
            </button>
        </div>

        <!-- Yükleniyor Göstergesi -->
        <div id="loadingBox" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-3">
            <div class="inline-block animate-spin text-blue-500 text-2xl">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <p class="text-sm font-medium text-slate-300">Yapay Zeka MEB müfredatına göre soruyu inceliyor...</p>
        </div>

        <!-- Çözüm Sonucu -->
        <div id="resultBox" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> MEB Onaylı Çözüm ve Açıklama
                </h3>
                <span id="resultBadge" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700"></span>
            </div>
            <div id="resultContent" class="text-sm text-slate-200 leading-relaxed space-y-3"></div>
        </div>

    </main>

    <!-- JavaScript Mantığı -->
    <script>
        // Dersler Listesi (MEB Müfredatı)
        const lessonsByGrade = {
            "5. Sınıf": ["Matematik", "Fen Bilimleri", "Türkçe", "Sosyal Bilgiler", "Din Kültürü ve Ahlak Bilgisi", "İngilizce"],
            "6. Sınıf": ["Matematik", "Fen Bilimleri", "Türkçe", "Sosyal Bilgiler", "Din Kültürü ve Ahlak Bilgisi", "İngilizce"],
            "7. Sınıf": ["Matematik", "Fen Bilimleri", "Türkçe", "Sosyal Bilgiler", "Din Kültürü ve Ahlak Bilgisi", "İngilizce"],
            "8. Sınıf (LGS)": ["LGS Matematik", "LGS Fen Bilimleri", "LGS Türkçe", "T.C. İnkılap Tarihi", "Din Kültürü ve Ahlak Bilgisi", "İngilizce"],
            "9. Sınıf": ["Matematik", "Fizik", "Kimya", "Biyoloji", "Türk Dili ve Edebiyatı", "Tarih", "Coğrafya"],
            "10. Sınıf": ["Matematik", "Fizik", "Kimya", "Biyoloji", "Türk Dili ve Edebiyatı", "Tarih", "Coğrafya"],
            "11. Sınıf": ["Matematik", "Fizik", "Kimya", "Biyoloji", "Türk Dili ve Edebiyatı", "Tarih", "Coğrafya", "Felsefe"],
            "12. Sınıf (TYT/AYT)": ["TYT Türkçe", "TYT Matematik", "AYT Matematik", "Fizik", "Kimya", "Biyoloji", "Tarih", "Coğrafya", "Felsefe Grubu"]
        };

        function updateLessons() {
            const grade = document.getElementById('gradeLevel').value;
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '';
            (lessonsByGrade[grade] || []).forEach(lesson => {
                const opt = document.createElement('option');
                opt.value = lesson;
                opt.textContent = lesson;
                select.appendChild(opt);
            });
        }
        updateLessons();

        // API Key Kaydetme
        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Anahtarı başarıyla kaydedildi!');
            } else {
                alert('Lütfen geçerli bir anahtar girin.');
            }
        }
        window.onload = () => {
            const saved = localStorage.getItem('gemini_api_key');
            if(saved) document.getElementById('apiKey').value = saved;
        };

        // Sekme Yönetimi
        let currentTab = 'draw';
        function switchTab(tab) {
            currentTab = tab;
            if(tab === 'draw') {
                document.getElementById('sectionDraw').classList.remove('hidden');
                document.getElementById('sectionPhoto').classList.add('hidden');
                document.getElementById('tabDraw').className = "flex-1 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1.5";
                document.getElementById('tabPhoto').className = "flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5";
            } else {
                document.getElementById('sectionPhoto').classList.remove('hidden');
                document.getElementById('sectionDraw').classList.add('hidden');
                document.getElementById('tabPhoto').className = "flex-1 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1.5";
                document.getElementById('tabDraw').className = "flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5";
            }
        }

        // Çizim Tahtası İşlemleri
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentTool = 'pen';

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function setTool(tool) {
            currentTool = tool;
            if(tool === 'pen') {
                document.getElementById('btnPen').className = "px-3 py-1 bg-blue-600 text-white text-xs rounded-lg font-medium transition";
                document.getElementById('btnEraser').className = "px-3 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg font-medium transition";
            } else {
                document.getElementById('btnEraser').className = "px-3 py-1 bg-blue-600 text-white text-xs rounded-lg font-medium transition";
                document.getElementById('btnPen').className = "px-3 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg font-medium transition";
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 20;
            } else {
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3;
            }
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDraw() {
            isDrawing = false;
        }

        // Fotoğraf İşlemleri
        let uploadedImageBase64 = null;
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('imagePreview').src = uploadedImageBase64;
                    document.getElementById('previewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            uploadedImageBase64 = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').classList.add('hidden');
        }

        // Sıfırlama
        function resetApp() {
            clearCanvas();
            removeImage();
            document.getElementById('studentNote').value = '';
            document.getElementById('resultBox').classList.add('hidden');
        }

        // Yapay Zeka Çözüm Fonksiyonu
        async function solveQuestion() {
            const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                alert('Lütfen geçerli bir Gemini API Anahtarı girin!');
                return;
            }

            let imageToSend = null;
            if(currentTab === 'draw') {
                imageToSend = canvas.toDataURL('image/jpeg', 0.8);
            } else {
                imageToSend = uploadedImageBase64;
            }

            if(!imageToSend) {
                alert('Lütfen çözülmesi için bir soru çizin veya fotoğraf ekleyin!');
                return;
            }

            const grade = document.getElementById('gradeLevel').value;
            const lesson = document.getElementById('lessonSelect').value;
            const note = document.getElementById('studentNote').value.trim();

            document.getElementById('loadingBox').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');

            const base64Data = imageToSend.split(',')[1];
            const mimeType = imageToSend.split(';')[0].split(':')[1];

            const promptText = `Sen T.C. Millî Eğitim Bakanlığı (MEB) müfredatına ve kazanımlarına tam hakim, uzman bir öğretmen ve eğitim koçusun.
Öğrenci Seviyesi: ${grade}
Ders: ${lesson}
Öğrencinin Notu/Sorusu: ${note ? note : "Yok"}

Görüntüdeki el yazısı veya fotoğraflı soruyu dikkatlice incele. 
Şu formatta detaylı, eğitici ve anlaşılır bir çözüm hazırla:
1. **Soru Analizi & MEB Kazanımı:** Bu sorunun hangi MEB kazanımıyla ilgili olduğunu belirt.
2. **Adım Adım Çözüm:** Öğrencinin kolayca anlayabileceği şekilde, mantığını açıklayarak çöz.
3. **Sınav İpucu / Öğretmen Notu:** LGS veya YKS (TYT/AYT) bağlamında bu tarz sorularda dikkat edilmesi gereken püf noktaları paylaş.
Yanıtını Markdown formatında, net başlıklar ve temiz bir dille yaz.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: mimeType, data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('loadingBox').classList.add('hidden');

                if(data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('resultBadge').textContent = `${grade} - ${lesson}`;
                    
                    // Basit Markdown biçimlendirme
                    let formatted = text
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-300">$1</strong>')
                        .replace(/\n/g, '<br>');
                        
                    document.getElementById('resultContent').innerHTML = formatted;
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error(data.error?.message || 'Yapay zeka yanıt oluşturamadı.');
                }
            } catch(error) {
                document.getElementById('loadingBox').classList.add('hidden');
                alert('Bir hata oluştu: ' + error.message);
            }
        }
    </script>
</body>
</html>
